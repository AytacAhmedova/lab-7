<!DOCTYPE html>
<html>
<head>
  <title>Tapşırıq 3</title>
</head>
<body>

<h2 id="count">0</h2>

<button onclick="increase()">Artır</button>
<button onclick="decrease()">Azalt</button>

<script>
let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerText = count;
}

function decrease() {
    count--;
    document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
